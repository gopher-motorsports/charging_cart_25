                samples_buffered: 1

            bmsChargerHardwareFailureAlert_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1

            bmsChargerOverTempAlert_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1


            # Other Alerts
            bmsOvervoltageWarningAlert_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1

            bmsUndervoltageWarningAlert_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1

            bmsCellImbalanceAlert_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1

            bmsOvertempWarningAlert_state:
                ADC: NON_ADC
